<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0'>
    <title>NYL New Orleans Training Calendar</title>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js' integrity='sha384-B1OFx8Gy9GjPu8UbUyXbGQpzll9ubAUQ9agInFJ8NnD7nYG1u/CLR+Sqr5yifl4q' crossorigin='anonymous'></script>
    <style>
        :root { --nyl-navy: #0a2e5a; --nyl-gold: #d4af37 }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            max-width: 100%; 
            margin: 0; 
            padding: 12px;
            box-sizing: border-box;
            background: #f8f9fa;
        }
        header { 
            background: var(--nyl-navy); 
            color: white; 
            padding: 10px; 
            border-radius: 5px; 
            display: flex; 
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        .logo { 
            height: 36px; 
            margin-bottom: 8px;
            max-width: 100%;
        }
        h1 {
            font-size: 1.1em;
            margin: 0;
            line-height: 1.2;
        }
        .fc {
            font-size: 0.85em;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .fc-header-toolbar {
            padding: 8px 10px;
            background: white;
            border-bottom: 1px solid #eee;
        }
        .fc-daygrid-day {
            min-height: 65px !important;
        }
        .fc-daygrid-event {
            background-color: var(--nyl-gold); 
            border-color: var(--nyl-gold);
            padding: 3px 6px !important;
            margin: 2px 1px !important;
            font-size: 0.8em !important;
            white-space: normal !important;
            overflow: visible !important;
            line-height: 1.3 !important;
        }
        .fc-list-event {
            padding: 10px 12px !important;
        }
        .fc-list-event-title {
            font-weight: 600 !important;
        }
        footer {
            margin-top: 25px; 
            color: #555; 
            font-size: 0.8em;
            line-height: 1.5;
            padding: 15px 0;
            border-top: 1px solid #eee;
        }
        /* Mobile-specific overrides */
        @media (max-width: 600px) {
            .fc-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .fc-button-group {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-top: 8px;
            }
            .fc-button {
                flex: 1 0 auto;
                min-width: 70px;
                font-size: 0.85em;
                padding: 5px 8px !important;
            }
            .fc-toolbar-title {
                font-size: 1.05em !important;
                text-align: center;
                margin: 5px 0;
            }
            .fc-daygrid-day-number {
                font-size: 0.9em !important;
            }
            .fc-list-sticky {
                background: white !important;
                z-index: 10 !important;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src='NOLOGO2.png' class="logo" alt="NYL New Orleans">
        <h1>New Orleans General Office Training Calendar</h1>
    </header>

    <div id='calendar'></div>

    <footer>
        <p>Training inquiries: orreeves@newyorklife.com<br>
        Office: 639 Loyola Ave #1900, New Orleans LA 70113</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('events.json')
                .then(response => response.json())
                .then(events => {
                    var calendarEl = document.getElementById('calendar');
                    var calendar = new FullCalendar.Calendar(calendarEl, {
                        initialView: window.innerWidth < 600 ? 'listWeek' : 'dayGridMonth',
                        headerToolbar: {
                            left: 'prev,next today',
                            center: 'title',
                            right: window.innerWidth < 600 ? 'dayGridMonth,listWeek' : 'dayGridMonth,timeGridWeek,listWeek'
                        },
                        events: events,
                        handleWindowResize: true,
                        windowResizeDelay: 100,
                        eventContent: function(info) {
                            return {
                                html: `<b>${info.event.title}</b><div style='font-size: 0.8em; margin-top: 2px'>${info.event.start ? info.event.start.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : ''}</div>`
                            }
                        },
                        viewDidMount: function(info) {
                            if (window.innerWidth < 600 && info.view.type === 'dayGridMonth') {
                                // Force more spacing in month view on mobile
                                document.querySelectorAll('.fc-daygrid-day').forEach(day => {
                                    day.style.minHeight = '75px';
                                });
                            }
                        }
                    });
                    calendar.render();

                    // Handle orientation changes
                    window.addEventListener('resize', function() {
                        if (window.innerWidth < 600 && calendar.view.type !== 'listWeek') {
                            calendar.changeView('listWeek');
                        } else if (window.innerWidth >= 600 && calendar.view.type === 'listWeek') {
                            calendar.changeView('dayGridMonth');
                        }
                    });
                });
        });
    </script>
</body>
</html>
