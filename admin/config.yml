backend:
  name: git-gateway
  branch: main

media_folder: "media"
public_folder: "/media"

collections:
  - name: "events"
    label: "Training Events"
    folder: "/"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Start Date", name: "start", widget: "datetime", dateFormat: "YYYY-MM-DD", timeFormat: "HH:mm"}
      - {label: "End Date", name: "end", widget: "datetime", dateFormat: "YYYY-MM-DD", timeFormat: "HH:mm"}
      - {label: "Description", name: "description", widget: "text"}